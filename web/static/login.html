<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light">
    <title>登录 · Narwhal Cloud</title>
    <link rel="icon" href="/favicon.ico">
    <style>
        :root { --background: #f3f5f8; --surface: #fff; --ink: #172338; --muted: #59677b; --line: #dce2ea; --accent: #3f51c6; --accent-hover: #3041b0; --error: #b42318; --success: #187047; --ring: #8090eb; }
        * { box-sizing: border-box; }
        body { margin: 0; background: var(--background); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif; font-size: 16px; line-height: 1.6; }
        button, input { font: inherit; }
        button { cursor: pointer; touch-action: manipulation; }
        button:focus-visible, a:focus-visible { outline: 3px solid var(--ring); outline-offset: 4px; }
        [hidden] { display: none !important; }
        .page { min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; padding: 0 max(24px, env(safe-area-inset-left)); }
        .header { width: min(1104px, 100%); margin: 0 auto; min-height: 104px; display: flex; align-items: center; justify-content: space-between; gap: 20px; }
        .brand { display: flex; align-items: center; gap: 12px; }
        .brand img { width: 36px; height: 36px; border-radius: 10px; }
        .brand-name { font-size: 17px; font-weight: 700; letter-spacing: -.3px; }
        .brand small { display: block; font-size: 12px; line-height: 1.4; color: var(--muted); }
        .language { min-height: 44px; min-width: 76px; padding: 8px 12px; border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 8px; font-size: 13px; transition: background .18s; }
        .language:hover { background: var(--surface); }
        .content { flex: 1; display: grid; place-items: center; padding: 24px 0 48px; }
        .login-layout { width: min(1000px, 100%); display: grid; grid-template-columns: 1fr 1fr; background: var(--surface); border: 1px solid var(--line); border-radius: 20px; overflow: hidden; box-shadow: 0 16px 52px -28px #16243e38; }
        .intro { position: relative; overflow: hidden; padding: 48px; background: #17243b; color: #f8fafc; display: flex; flex-direction: column; justify-content: space-between; gap: 48px; }
        .eyebrow { margin: 0 0 18px; color: #b7c5db; font-size: 12px; font-weight: 600; letter-spacing: 2px; }
        .intro h1 { margin: 0; font-size: clamp(32px, 3.2vw, 40px); line-height: 1.4; letter-spacing: -1px; font-weight: 650; }
        .intro-description { color: #bdc9dc; margin: 18px 0 0; font-size: 14px; line-height: 1.9; max-width: 330px; }
        .features { display: grid; gap: 20px; }
        .feature { display: flex; align-items: center; gap: 14px; }
        .feature-icon { width: 40px; height: 40px; border: 1px solid #40516c; border-radius: 10px; display: grid; place-items: center; color: #c7d5eb; flex-shrink: 0; }
        svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
        .feature p { margin: 0; font-size: 14px; }
        .feature small { display: block; margin-top: 1px; color: #b7c5db; font-size: 12px; }
        .intro-footer { display: flex; align-items: center; gap: 10px; color: #b7c5db; border-top: 1px solid #40516c; padding-top: 22px; font-size: 12px; }
        .intro-footer svg { width: 16px; height: 16px; flex-shrink: 0; }
        .form-panel { padding: 52px 48px 40px; display: flex; flex-direction: column; justify-content: center; }
        .form-panel h2 { font-size: 27px; line-height: 1.4; margin: 0 0 9px; letter-spacing: -.5px; }
        .form-description { margin: 0 0 32px; font-size: 14px; color: var(--muted); }
        .field { margin-bottom: 22px; }
        label { display: block; margin-bottom: 8px; font-size: 14px; font-weight: 600; }
        .input-wrap { position: relative; }
        .input-icon { position: absolute; top: 16px; left: 15px; width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
        input { width: 100%; min-height: 52px; padding: 12px 14px 12px 44px; border: 1px solid var(--line); border-radius: 9px; color: var(--ink); background: var(--surface); outline: none; transition: border-color .18s, box-shadow .18s; }
        input::placeholder { color: #6b778a; font-size: 14px; }
        input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px #3f51c619; }
        input[aria-invalid="true"] { border-color: var(--error); }
        input[type="password"], #password { padding-right: 66px; }
        .password-toggle { position: absolute; top: 4px; right: 4px; min-height: 44px; min-width: 52px; padding: 0 10px; border: 0; border-radius: 6px; color: var(--muted); background: transparent; font-size: 12px; }
        .password-toggle:hover { color: var(--accent); background: #f2f4ff; }
        .form-note { margin: -4px 0 26px; color: var(--muted); font-size: 12px; }
        .submit { min-height: 52px; width: 100%; border: 0; border-radius: 9px; background: var(--accent); color: white; display: flex; justify-content: center; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; transition: background .18s; }
        .submit:hover { background: var(--accent-hover); }
        .submit:active { background: #263695; }
        .submit:disabled { cursor: wait; opacity: .75; }
        .submit svg { width: 18px; height: 18px; }
        .spinner { width: 18px; height: 18px; border: 2px solid #ffffff66; border-top-color: white; border-radius: 50%; animation: spin .8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .feedback { min-height: 52px; padding-top: 12px; }
        .error { margin: 0; color: var(--error); font-size: 13px; line-height: 1.6; }
        .error[data-kind="info"] { color: var(--muted); }
        .error[data-kind="success"] { color: var(--success); }
        .form-help { border-top: 1px solid var(--line); margin: 8px 0 0; padding-top: 20px; color: var(--muted); font-size: 12px; }
        .footer { width: min(1104px, 100%); margin: 0 auto; min-height: 68px; display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-bottom: max(12px, env(safe-area-inset-bottom)); color: var(--muted); font-size: 12px; }
        .host { max-width: 60%; overflow-wrap: anywhere; font-family: ui-monospace, SFMono-Regular, Consolas, monospace; text-align: right; }
        @media (max-width: 800px) { .intro { padding: 36px 28px; } .form-panel { padding: 40px 28px 28px; } }
        @media (max-width: 640px) {
            .page { padding: 0 max(20px, env(safe-area-inset-left)); }
            .header { min-height: 88px; }
            .content { padding: 12px 0 24px; }
            .login-layout { max-width: 440px; grid-template-columns: 1fr; border-radius: 16px; }
            .intro { padding: 26px 26px 24px; gap: 0; }
            .eyebrow { margin-bottom: 8px; font-size: 11px; }
            .intro h1 { font-size: 26px; line-height: 1.5; }
            .intro h1 br { display: none; }
            .intro-description { margin-top: 8px; font-size: 13px; }
            .features, .intro-footer { display: none; }
            .form-panel { padding: 28px 26px 20px; }
            .form-panel h2 { font-size: 23px; }
            .form-description { margin-bottom: 24px; font-size: 13px; }
            .footer { min-height: 56px; font-size: 11px; }
        }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
    </style>
</head>
<body>
<div class="page">
    <header class="header">
        <div class="brand">
            <img src="/logo.png" alt="" width="36" height="36">
            <div><span class="brand-name">Narwhal Cloud</span><small data-i18n="brandSubtitle">主机管理面板</small></div>
        </div>
        <button class="language" id="language" type="button" aria-label="Switch to English">English</button>
    </header>
    <main class="content">
        <div class="login-layout">
            <section class="intro" aria-labelledby="intro-title">
                <div>
                    <p class="eyebrow">NARWHAL CLOUD / AGENT</p>
                    <h1 id="intro-title" data-i18n="introTitle">每台主机，<br>一目了然。</h1>
                    <p class="intro-description" data-i18n="introDescription">从资源监控到容器管理，<br>在一个面板中完成日常运维。</p>
                </div>
                <div class="features">
                    <div class="feature"><span class="feature-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="8" rx="2"/><rect x="4" y="13" width="16" height="8" rx="2"/><path d="M8 7h.01M8 17h.01M12 7h4M12 17h4"/></svg></span><p><span data-i18n="featureVM">容器与虚拟机</span><small data-i18n="featureVMDetail">统一管理实例、镜像与控制台</small></p></div>
                    <div class="feature"><span class="feature-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-7 4 14 3-7h4"/></svg></span><p><span data-i18n="featureMonitor">资源与网络</span><small data-i18n="featureMonitorDetail">查看主机负载、流量与运行状态</small></p></div>
                    <div class="feature"><span class="feature-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 5-8 9-8 9s-8-4-8-9V6l8-3Z"/><path d="m8 12 3 3 5-6"/></svg></span><p><span data-i18n="featureFirewall">防火墙与访问</span><small data-i18n="featureFirewallDetail">配置防火墙规则与端口转发</small></p></div>
                </div>
                <div class="intro-footer"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg><span data-i18n="privateConsole">管理员访问入口</span></div>
            </section>
            <section class="form-panel" aria-labelledby="login-title">
                <h2 id="login-title" data-i18n="loginTitle">登录控制台</h2>
                <p class="form-description" data-i18n="loginDescription">使用本机配置的管理员账号继续。</p>
                <form id="login-form" aria-labelledby="login-title">
                    <div class="field">
                        <label for="username" data-i18n="username">账号</label>
                        <div class="input-wrap">
                            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M5 21v-2a7 7 0 0 1 14 0v2"/></svg>
                            <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="请输入管理员账号" aria-describedby="login-error" required maxlength="256" autofocus>
                        </div>
                    </div>
                    <div class="field">
                        <label for="password" data-i18n="password">密码</label>
                        <div class="input-wrap">
                            <svg class="input-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V6a4 4 0 0 1 8 0v4"/></svg>
                            <input id="password" name="password" type="password" autocomplete="current-password" placeholder="请输入密码" aria-describedby="login-error" required>
                            <button class="password-toggle" id="password-toggle" type="button" aria-label="显示密码" aria-pressed="false" data-i18n="show">显示</button>
                        </div>
                    </div>
                    <p class="form-note" data-i18n="sessionNote">登录后可在控制台右上角退出。</p>
                    <button class="submit" id="submit" type="submit"><span class="spinner" id="spinner" hidden aria-hidden="true"></span><span id="submit-label" data-i18n="signIn">登录</span><svg id="submit-arrow" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></button>
                    <div class="feedback"><p class="error" id="login-error" role="alert" aria-live="polite"></p></div>
                </form>
                <p class="form-help" data-i18n="help">账号或密码由主机管理员配置。如无法登录，请联系管理员。</p>
                <noscript><p class="error">请启用 JavaScript 后登录。 / Enable JavaScript to sign in.</p></noscript>
            </section>
        </div>
    </main>
    <footer class="footer"><span>Narwhal Cloud Agent</span><span class="host" id="host"></span></footer>
</div>
<script>
    const copy = {
        zh: { brandSubtitle: '主机管理面板', introTitle: '每台主机，<br>一目了然。', introDescription: '从资源监控到容器管理，<br>在一个面板中完成日常运维。', featureVM: '容器与虚拟机', featureVMDetail: '统一管理实例、镜像与控制台', featureMonitor: '资源与网络', featureMonitorDetail: '查看主机负载、流量与运行状态', featureFirewall: '防火墙与访问', featureFirewallDetail: '配置防火墙规则与端口转发', privateConsole: '管理员访问入口', loginTitle: '登录控制台', loginDescription: '使用本机配置的管理员账号继续。', username: '账号', password: '密码', usernamePlaceholder: '请输入管理员账号', passwordPlaceholder: '请输入密码', show: '显示', hide: '隐藏', sessionNote: '登录后可在控制台右上角退出。', signIn: '登录', signingIn: '正在登录…', help: '账号或密码由主机管理员配置。如无法登录，请联系管理员。', invalidCredentials: '账号或密码不正确，请重新输入。', networkError: '无法连接服务器，请检查网络后重试。', unavailable: '暂时无法登录，请稍后重试。', expired: '登录已过期，请重新登录。', signedOut: '已退出登录。' },
        en: { brandSubtitle: 'Host management console', introTitle: 'Your host.<br>A clearer view.', introDescription: 'Manage resources, containers and access<br>from one focused console.', featureVM: 'Containers & virtual machines', featureVMDetail: 'Instances, images and console access', featureMonitor: 'Resources & networking', featureMonitorDetail: 'Host load, traffic and runtime status', featureFirewall: 'Firewall & access', featureFirewallDetail: 'Firewall rules and port forwarding', privateConsole: 'Administrator access', loginTitle: 'Sign in to your console', loginDescription: 'Use the administrator account configured on this host.', username: 'Username', password: 'Password', usernamePlaceholder: 'Enter your username', passwordPlaceholder: 'Enter your password', show: 'Show', hide: 'Hide', sessionNote: 'You can sign out from the top-right of the console.', signIn: 'Sign in', signingIn: 'Signing in…', help: 'Your host administrator manages these credentials. Contact them if you cannot sign in.', invalidCredentials: 'Incorrect username or password. Please try again.', networkError: 'Cannot reach the server. Check your connection and try again.', unavailable: 'Unable to sign in right now. Please try again later.', expired: 'Your session expired. Please sign in again.', signedOut: 'You have signed out.' }
    };
    const $ = id => document.getElementById(id);
    const params = new URLSearchParams(location.search);
    let language = navigator.language.toLowerCase().startsWith('zh') ? 'zh' : 'en';
    let busy = false;
    let message = params.get('reason') === 'expired' ? 'expired' : params.get('reason') === 'logout' ? 'signedOut' : '';
    function renderLanguage() {
        document.documentElement.lang = language === 'zh' ? 'zh-CN' : 'en';
        document.title = copy[language].loginTitle + ' · Narwhal Cloud';
        document.querySelectorAll('[data-i18n]').forEach(element => {
            const key = element.dataset.i18n;
            if (key === 'introTitle' || key === 'introDescription') element.innerHTML = copy[language][key];
            else element.textContent = copy[language][key];
        });
        $('username').placeholder = copy[language].usernamePlaceholder;
        $('password').placeholder = copy[language].passwordPlaceholder;
        const visible = $('password').type === 'text';
        $('password-toggle').textContent = copy[language][visible ? 'hide' : 'show'];
        $('password-toggle').setAttribute('aria-label', copy[language][visible ? 'hide' : 'show'] + ' ' + copy[language].password);
        $('language').textContent = language === 'zh' ? 'English' : '中文';
        $('language').setAttribute('aria-label', language === 'zh' ? 'Switch to English' : '切换为中文');
        $('submit-label').textContent = copy[language][busy ? 'signingIn' : 'signIn'];
        $('login-error').textContent = message ? copy[language][message] : '';
        $('login-error').dataset.kind = message === 'signedOut' ? 'success' : message === 'expired' ? 'info' : 'error';
    }
    $('language').addEventListener('click', () => { language = language === 'zh' ? 'en' : 'zh'; renderLanguage(); });
    $('password-toggle').addEventListener('click', () => {
        const visible = $('password').type === 'password';
        $('password').type = visible ? 'text' : 'password';
        $('password-toggle').setAttribute('aria-pressed', String(visible));
        renderLanguage();
    });
    $('login-form').addEventListener('input', () => {
        message = '';
        $('login-error').textContent = '';
        $('username').removeAttribute('aria-invalid');
        $('password').removeAttribute('aria-invalid');
    });
    $('login-form').addEventListener('submit', async event => {
        event.preventDefault();
        if (busy) return;
        busy = true;
        message = '';
        $('submit').disabled = true;
        $('login-form').setAttribute('aria-busy', 'true');
        $('spinner').hidden = false;
        $('submit-arrow').hidden = true;
        renderLanguage();
        let redirected = false;
        try {
            const response = await fetch('/api/auth/login', {
                method: 'POST', credentials: 'same-origin', headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({username: $('username').value, password: $('password').value, next: params.get('next') || '/'}),
                signal: AbortSignal.timeout(15000)
            });
            if (!response.ok) {
                message = response.status === 401 ? 'invalidCredentials' : 'unavailable';
                if (response.status === 401) {
                    $('username').setAttribute('aria-invalid', 'true');
                    $('password').setAttribute('aria-invalid', 'true');
                    $('password').value = '';
                    $('password').focus();
                }
                return;
            }
            const result = await response.json();
            const next = new URL(result.redirect || '/', location.origin);
            $('password').value = '';
            location.replace(next.origin === location.origin ? next.pathname + next.search + next.hash : '/');
            redirected = true;
        } catch {
            message = 'networkError';
        } finally {
            if (!redirected) {
                busy = false;
                $('submit').disabled = false;
                $('login-form').removeAttribute('aria-busy');
                $('spinner').hidden = true;
                $('submit-arrow').hidden = false;
                renderLanguage();
            }
        }
    });
    $('host').textContent = location.host;
    renderLanguage();
</script>
</body>
</html>

name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Test Agent and installer
        env:
          CGO_ENABLED: 0
        run: |
          go test -tags containers_image_openpgp ./...
          bash -n install.sh
          python3 -m unittest discover -s tests -v
          bash install.sh --help >/dev/null
          status_output="$(bash install.sh --status)"
          if grep -q 'Select language' <<<"$status_output"; then
            echo 'one-shot status unexpectedly prompted for language' >&2
            exit 1
          fi
          printf '0\n' | bash install.sh zh --menu >/dev/null
          curl() {
            case "$*" in
              *ip.sb*) printf '203.0.113.1\n' ;;
              *) echo "unexpected curl in streamed status test: $*" >&2; return 127 ;;
            esac
          }
          export -f curl
          streamed_status_output="$(printf '1\n2\n' | bash <(command curl --limit-rate 8k -fsSL "file://$PWD/install.sh") zh --menu 2>&1)"
          unset -f curl
          grep -q 'PANEL=http://203.0.113.1:8792' <<<"$streamed_status_output"
          if grep -Eq 'curl: \(23\)|Failure writing output to destination' <<<"$streamed_status_output"; then
            echo 'streamed status reported a downloader write error' >&2
            exit 1
          fi
          bash install.sh en --validate-ipv6 --ipv6-mode subnet \
            --ipv6-addr 2001:db8:100::1 --ipv6-subnet 2001:db8:100::/64 \
            --ipv6-iface lo --ipv6-routed --skip-ipv6-probe --non-interactive
          bash install.sh en --validate-ipv6 --ipv6-mode subnet \
            --ipv6-addr 2001:db8:200::1 --ipv6-subnet 2001:db8:200::/64 \
            --ipv6-iface lo --skip-ipv6-probe --non-interactive
          if bash install.sh en --validate-ipv6 --ipv6-mode subnet \
            --ipv6-addr 2001:db8:300::1 --ipv6-subnet 2001:db8:301::/64 \
            --ipv6-iface lo --skip-ipv6-probe --non-interactive; then
            echo 'invalid IPv6 values unexpectedly passed validation' >&2
            exit 1
          fi

  build-agent:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goarch: amd64
          - goarch: arm64

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Build Agent
        env:
          GOOS: linux
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          build_version="${{ github.ref_name }}"
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            # Fork checkouts do not reliably include upstream tags. Fetch them
            # explicitly, then choose only a tag reachable from this fork SHA.
            git fetch --force --tags https://github.com/narwhal-cloud/runman-agent.git
            upstream_base=$(git tag --merged "${GITHUB_SHA}" --list 'v[0-9]*' --sort=-version:refname | head -n1)
            [ -n "$upstream_base" ] || { echo "Unable to resolve upstream release baseline" >&2; exit 1; }
            build_version="${upstream_base}-diy.${GITHUB_SHA::12}"
          fi
          go build \
            -tags containers_image_openpgp \
            -ldflags="-s -w -X main.version=${build_version}" \
            -o runman-agent-linux-${{ matrix.goarch }} \
            .

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: runman-agent-linux-${{ matrix.goarch }}
          path: runman-agent-linux-${{ matrix.goarch }}
          retention-days: 1

  build-rfw:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch: amd64
            variant: modern
            ring_version: locked
            asset: rfw-amd64
          - target: x86_64-unknown-linux-musl
            arch: amd64
            variant: legacy
            ring_version: "0.17.12"
            asset: rfw-amd64-legacy
          - target: aarch64-unknown-linux-musl
            arch: arm64
            variant: modern
            ring_version: locked
            asset: rfw-arm64

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          repository: narwhal-cloud/rfw
          ref: dev

      - uses: actions/checkout@v7
        with:
          path: runman-agent

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools zstd

      - name: Setup Zig for cross compilation
        if: matrix.arch == 'arm64'
        uses: mlugg/setup-zig@v2

      - name: Install cargo-zigbuild
        if: matrix.arch == 'arm64'
        run: cargo install cargo-zigbuild --locked

      - name: Setup Rust toolchain
        run: |
          rustup toolchain install stable
          rustup toolchain install nightly --component rust-src
          rustup target add --toolchain stable ${{ matrix.target }}

      - name: Use a CPU-compatible Rustls provider
        run: |
          python3 runman-agent/scripts/patch-rfw-ring-provider.py "$GITHUB_WORKSPACE" \
            --ring-version "${{ matrix.ring_version }}"
          cargo tree -p rfw -e normal | tee /tmp/rfw-dependencies.txt
          if grep -Eq 'aws-lc(-rs|-sys)? v' /tmp/rfw-dependencies.txt; then
            echo 'RFW still includes aws-lc-rs; refusing to publish a potentially AVX2-only binary' >&2
            exit 1
          fi
          ring_versions="$(grep -oE 'ring v[0-9]+\.[0-9]+\.[0-9]+' /tmp/rfw-dependencies.txt | sort -u)"
          if [ "$(printf '%s\n' "$ring_versions" | sed '/^$/d' | wc -l)" -ne 1 ]; then
            echo "RFW must resolve one ring version; found: $ring_versions" >&2
            exit 1
          fi
          if [ "${{ matrix.ring_version }}" = '0.17.12' ]; then
            [ "$ring_versions" = 'ring v0.17.12' ] || {
              echo "legacy RFW must use ring 0.17.12; found: $ring_versions" >&2
              exit 1
            }
          else
            [ "$ring_versions" != 'ring v0.17.12' ] || {
              echo 'modern RFW must use the current lockfile ring version' >&2
              exit 1
            }
          fi

      - name: Install bpf-linker
        run: |
          mkdir -p ~/.cargo/bin
          curl -fsSL https://github.com/aya-rs/bpf-linker/releases/download/v0.11.0/bpf-linker-x86_64-unknown-linux-musl.tar.zst | zstd -d | tar -x -C ~/.cargo/bin
          if [ -d ~/.cargo/bin/bpf-linker-* ]; then
            cp -f ~/.cargo/bin/bpf-linker-*/bpf-linker ~/.cargo/bin/ 2>/dev/null || true
          fi
          chmod +x ~/.cargo/bin/bpf-linker
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Build rfw
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
        run: |
          if [ "${{ matrix.arch }}" = "arm64" ]; then
            cargo zigbuild --package rfw --release --target ${{ matrix.target }}
          else
            cargo --config 'target.x86_64-unknown-linux-musl.rustflags=["-C","target-cpu=x86-64"]' \
              build --package rfw --release --target x86_64-unknown-linux-musl
          fi
          cp target/${{ matrix.target }}/release/rfw "${{ matrix.asset }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: rfw-${{ matrix.arch }}-${{ matrix.variant }}
          path: ${{ matrix.asset }}
          retention-days: 1

  release:
    needs: [test, build-agent, build-rfw]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Generate release checksums
        run: |
          sha256sum \
            runman-agent-linux-amd64 \
            runman-agent-linux-arm64 \
            install.sh \
            rfw-amd64 \
            rfw-amd64-legacy \
            rfw-arm64 \
            > SHA256SUMS

      - name: Create tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            runman-agent-linux-amd64
            runman-agent-linux-arm64
            install.sh
            rfw-amd64
            rfw-amd64-legacy
            rfw-arm64
            SHA256SUMS
          generate_release_notes: true

      - name: Create rolling continuous release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch --force --tags https://github.com/narwhal-cloud/runman-agent.git
          upstream_base=$(git tag --merged "${GITHUB_SHA}" --list 'v[0-9]*' --sort=-version:refname | head -n1)
          [ -n "$upstream_base" ] || { echo "Unable to resolve upstream release baseline" >&2; exit 1; }
          diy_version="${upstream_base}-diy.${GITHUB_SHA::12}"
          notes="DIY build based on upstream ${upstream_base}; fork commit ${GITHUB_SHA}."
          assets=(runman-agent-linux-amd64 runman-agent-linux-arm64 install.sh rfw-amd64 rfw-amd64-legacy rfw-arm64 SHA256SUMS)
          if gh release view continuous >/dev/null 2>&1; then
            # Preserve the release URL while replacing completed artifacts.
            # A failed update leaves the prior downloadable release intact.
            gh release upload continuous "${assets[@]}" --clobber
            gh release edit continuous --target "${GITHUB_SHA}" --prerelease --title "$diy_version" --notes "$notes"
          else
            gh release create continuous "${assets[@]}" \
              --target "${GITHUB_SHA}" \
              --prerelease \
              --title "$diy_version" \
              --notes "$notes"
          fi

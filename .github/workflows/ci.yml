name: CI

on:
  workflow_call:
  push:
    branches: [main, rust-v2]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "config.example.toml"
      - "proto/agent.proto"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "images/**"
      - "install-rust-v2.sh"
      - "README-RUST-V2.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-rust-v2.yml"
  pull_request:
    branches: [main, rust-v2]
    paths:
      - "Cargo.toml"
      - "Cargo.lock"
      - "build.rs"
      - "config.example.toml"
      - "proto/agent.proto"
      - "src/**"
      - "tests/**"
      - "scripts/**"
      - "images/**"
      - "install-rust-v2.sh"
      - "README-RUST-V2.md"
      - ".github/workflows/ci.yml"
      - ".github/workflows/release-rust-v2.yml"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests (protocol, panel, unit)
        run: cargo test
      - name: Installer
        run: |
          sudo apt-get install -y -qq shellcheck
          shellcheck -S style install-rust-v2.sh images/build.sh scripts/runman-update-guard.sh tests/with_wireguard_peer.sh
          bash install-rust-v2.sh --help >/dev/null
          bash install-rust-v2.sh --help | grep -q -- '--repair-rfw'
          bash tests/test_update_guard.sh
          python3 -m py_compile scripts/patch-rfw-ring-provider.py

  # Real containers on the runner VM: needs root, systemd and network.
  integration:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Host packages and limits (as install-rust-v2.sh sets them)
        run: |
          sudo apt-get install -y -qq nftables wireguard-tools e2fsprogs lxcfs iputils-ping
          sudo install -d /etc/systemd/system/lxcfs.service.d
          printf '[Service]\nExecStart=\nExecStart=/usr/bin/lxcfs --enable-cfs -l /var/lib/lxcfs\n' \
            | sudo tee /etc/systemd/system/lxcfs.service.d/runman.conf >/dev/null
          sudo systemctl daemon-reload
          sudo systemctl restart lxcfs
          sudo sysctl -q -w fs.inotify.max_user_instances=65536
      - name: Build tests
        run: cargo test --release --test runtime_linux --no-run
      - name: Runtime integration tests
        run: |
          set -o pipefail
          sudo env "PATH=$PATH" "HOME=$HOME" "CARGO_HOME=$HOME/.cargo" "RUSTUP_HOME=$HOME/.rustup" \
            bash tests/with_wireguard_peer.sh cargo test --release --test runtime_linux -- --ignored --test-threads=1 \
            instance_lifecycle ipv6_snat_mode ipv6_routed_pool concurrent_creates_get_distinct_slots \
            stopped_backup_restore wireguard_local_peer 2>&1 | tee test.log
      - name: Report integration failure
        if: failure()
        run: |
          # Surface the failing assertion as annotations (readable without log access).
          grep -A6 -E "panicked at|^Caused by" test.log | head -40 | while IFS= read -r line; do
            echo "::error title=runtime_linux::$line"
          done
          sudo journalctl -u 'runman-*' --no-pager -n 30 | while IFS= read -r line; do echo "::warning title=journal::$line"; done
